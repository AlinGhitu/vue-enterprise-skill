version: 2
updates:
  # The CI project that compiles, lints and tests the skill's examples.
  - package-ecosystem: npm
    directory: /checks
    schedule:
      interval: weekly
    # Matches pnpm's minimumReleaseAge: give new releases time to be vetted.
    cooldown:
      default-days: 7
    groups:
      checks:
        patterns: ["*"]
    commit-message:
      prefix: checks
    open-pull-requests-limit: 5

  # Actions in .github/workflows, pinned by commit SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
