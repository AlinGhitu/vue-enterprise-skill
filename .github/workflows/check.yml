name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: checks/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: checks/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Skill structure, snippet drift, vue-tsc, ESLint with the skill's rules, Vitest.
      - run: pnpm check
      # The Agent Skills reference validator, pinned to a commit (it isn't published to PyPI).
      - name: skills-ref validate
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate skills/vue-enterprise
