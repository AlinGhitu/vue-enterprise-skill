name: Agent ignored or misapplied the skill
description: Claude Code or Copilot wrote code that breaks a rule, or the skill didn't load.
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Claude Code
        - Copilot in VS Code (agent mode)
        - Copilot CLI
        - Copilot cloud agent
        - Copilot code review
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Tool version, model and skill version (footer of SKILL.md).
      placeholder: "Claude Code x.y.z, <model>, vue-enterprise 1.1.0"
    validations:
      required: true
  - type: dropdown
    id: loaded
    attributes:
      label: Did the skill load?
      description: The README explains how to check in each tool.
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt
      description: What you asked the agent, as close to word for word as you can.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: What the agent wrote, and which rule it should have followed.
    validations:
      required: true
